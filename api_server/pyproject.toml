[project]
name = "api-server"
version = "2.1.0"
requires-python = ">=3.11.5,<3.12"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.44.0",
    "python-multipart==0.0.26",
    "starlette==1.6.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.49",
    "pymysql==1.1.2",
    "redis==5.3.1",
    "hiredis==3.4.1",
    "arq==0.28.0",
    "boto3==1.43.81",
    "botocore==1.43.81",
    "pymongo==4.16.0",
    "pinecone==9.1.0",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-ollama==1.1.0",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.10",
    "niquests==3.21.0",
    "pymupdf==1.27.2.2",
    "pyjwt==2.12.1",
    "fastmcp==3.4.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff==0.16.7",
    "deptry==0.25.1",
    "ipython",
    "debugpy",
]

[tool.uv]
package = false

[tool.deptry]
extend_exclude = ["external", "app/tests"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pymysql",
    "hiredis",
    "python-multipart",
    "uvicorn",
    "python-dotenv",
]

[tool.deptry.package_module_name_map]
pymupdf = ["pymupdf"]